[package]
name = "not-news-app"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true

[dependencies]
arboard.workspace = true
keyring.workspace = true
not-news-agent = { path = "../agent" }
not-news-audio = { path = "../audio" }
not-news-domain = { path = "../domain" }
not-news-platform = { path = "../platform" }
not-news-renderer = { path = "../renderer" }
not-news-store = { path = "../store" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["blocking", "json", "query", "rustls"] }
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { workspace = true, features = ["blocking", "json", "native-tls-no-alpn", "query"] }

[dev-dependencies]
indexmap.workspace = true
tempfile.workspace = true

[lints]
workspace = true
