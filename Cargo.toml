[workspace]
members = [
  "crates/agent",
  "crates/app",
  "crates/domain",
  "crates/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wayland",
  "wgpu",
  "x11",
] }
indexmap = { version = "2.13.0", features = ["serde"] }
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tempfile = "3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
