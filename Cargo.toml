[workspace]
members = [
  "crates/agent",
  "crates/app",
  "crates/audio",
  "crates/domain",
  "crates/platform",
  "crates/renderer",
  "crates/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22.1"
command-group = "5.0.1"
cpal = "0.18.1"
fs2 = "0.4.3"
gl = "0.14.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
indexmap = { version = "2.13.0", features = ["serde"] }
keyring = "4.1.5"
hound = "3.5.1"
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
ringbuf = "0.5.0"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
skia-safe = { version = "0.99.0", features = ["gl", "textlayout"] }
softbuffer = "0.4.8"
thiserror = "2.0.18"
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["macros", "rt", "time"] }
unicode-segmentation = "1.13.3"
winit = "0.30.13"
zeroize = "1.9.0"
zbus = "5.17.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
