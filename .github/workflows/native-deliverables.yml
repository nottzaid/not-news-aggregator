name: Standalone executables

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-deliverables.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "scripts/package-*"
      - "scripts/prepare-linux-release"
      - "scripts/linux-release-linker"
      - "scripts/verify-*-release*"
  push:
    tags:
      - "rust-v*"

permissions:
  contents: read

concurrency:
  group: standalone-executables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Single Linux ELF
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install the build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            autoconf automake build-essential ca-certificates clang curl file git gperf jq libasound2-dev \
            libbrotli-dev libbz2-dev libexpat1-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dri libpng-dev libtool libxcursor1 libxi6 libxkbcommon-x11-0 \
            pkg-config python3 xz-utils xvfb zlib1g-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore compiler artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: single-elf-rust-1.95-${{ hashFiles('Cargo.lock', 'scripts/prepare-linux-release') }}

      - name: Prepare the static non-system boundary
        run: ./scripts/prepare-linux-release

      - name: Build exactly one Linux executable
        run: ./scripts/package-linux

      - name: Reject dependency leaks and execute the relocated ELF
        run: ./scripts/verify-linux-release

      - name: Upload the verified ELF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: not-news-linux-x86_64
          path: dist/not-news-linux-x86_64
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Single Windows executable
    runs-on: windows-2022
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore compiler artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: single-exe-rust-1.95-${{ hashFiles('Cargo.lock') }}

      - name: Install the declared toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Build exactly one Windows executable
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Exercise Windows Credential Manager with a disposable entry
        shell: pwsh
        run: cargo test -p not-news-app settings::tests::live_os_vault_round_trip_does_not_touch_the_user_key -- --ignored --exact

      - name: Execute the relocated Windows executable
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1

      - name: Upload the verified executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: not-news-windows-x86_64
          path: dist/not-news-windows-x86_64.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish two executables
    if: startsWith(github.ref, 'refs/tags/rust-v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact verified executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Enforce the public release shape
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 2
          chmod 0755 release/not-news-linux-x86_64
          test -x release/not-news-linux-x86_64
          test -f release/not-news-windows-x86_64.exe

      - name: Publish only the two executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#rust-v}"
          gh release create "$GITHUB_REF_NAME" \
            release/not-news-linux-x86_64 \
            release/not-news-windows-x86_64.exe \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Not News $version"
