name: Native deliverables

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-deliverables.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Packager.toml"
      - "assets/icon/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "scripts/package-*"
      - "scripts/verify-*-release*"
  push:
    tags:
      - "rust-v*"

permissions:
  contents: read

concurrency:
  group: native-deliverables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux packages and lifecycle
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore compiler and packager artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.cargo-packager
            target
          key: release-linux-rust-1.95-packager-0.11.8-${{ hashFiles('Cargo.lock', 'Packager.toml') }}

      - name: Install declared toolchain and native boundaries
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dri libxkbcommon-x11-0 xvfb jq
          if ! command -v cargo-packager >/dev/null; then
            cargo install cargo-packager --version 0.11.8 --locked
          fi
          test "$(cargo-packager --version)" = "cargo-packager 0.11.8"

      - name: Build reproducibly named Linux artifacts
        run: ./scripts/package-linux

      - name: Execute every relocatable Linux payload
        run: ./scripts/verify-linux-release

      - name: Prove install and uninstall preserve research
        run: |
          marker="$HOME/.local/share/not-news-canvas/release-preservation-marker"
          mkdir -p "$(dirname "$marker")"
          printf '%s' 'must survive uninstall' > "$marker"
          sudo dpkg -i dist/not-news_*_linux-x86_64.deb
          test -x /usr/bin/not-news-app
          cmp target/release/not-news-app /usr/bin/not-news-app
          test -f /usr/share/applications/not-news-app.desktop
          xvfb-run --auto-servernum not-news-app --release-self-check "$RUNNER_TEMP/installed-check"
          sudo dpkg -r not-news
          hash -r
          test ! -e /usr/bin/not-news-app
          test -f "$marker"
          sudo dpkg -i dist/not-news_*_linux-x86_64.deb
          test -x /usr/bin/not-news-app
          test -f "$marker"
          xvfb-run --auto-servernum not-news-app --release-self-check "$RUNNER_TEMP/reinstalled-check"
          sudo dpkg -r not-news
          hash -r
          test ! -e /usr/bin/not-news-app
          test -f "$marker"
          rm "$marker"

      - name: Upload verified Linux deliverables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: not-news-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.xz
            dist/BUILDINFO-linux-x86_64.json
            dist/DEPENDENCIES-linux-x86_64.json
            dist/RUNTIME-linux-x86_64.json
            dist/SHA256SUMS-linux-x86_64.txt
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows packages and lifecycle
    runs-on: windows-2022
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore compiler and packager artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-packager.exe
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-rust-1.95-packager-0.11.8-${{ hashFiles('Cargo.lock', 'Packager.toml') }}

      - name: Install declared toolchain and NSIS
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          if (-not (Get-Command cargo-packager -ErrorAction SilentlyContinue)) {
            cargo install cargo-packager --version 0.11.8 --locked
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          if ((cargo-packager --version) -ne "cargo-packager 0.11.8") {
            throw "unexpected cargo-packager version"
          }

      - name: Build reproducibly named Windows artifacts
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Exercise Windows Credential Manager with a disposable entry
        shell: pwsh
        run: cargo test -p not-news-app settings::tests::live_os_vault_round_trip_does_not_touch_the_user_key -- --ignored --exact

      - name: Execute portable, installed, and uninstalled Windows lifecycle
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 -InstallLifecycle

      - name: Upload verified Windows deliverables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: not-news-windows-x86_64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/BUILDINFO-windows-x86_64.json
            dist/DEPENDENCIES-windows-x86_64.json
            dist/RUNTIME-windows-x86_64.json
            dist/SHA256SUMS-windows-x86_64.txt
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish tagged prerelease
    if: startsWith(github.ref, 'refs/tags/rust-v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Publish a visible, checksum-bearing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#rust-v}"
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Not News $version"
