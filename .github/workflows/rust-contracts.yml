name: Rust rewrite evidence

on:
  push:
    branches:
      - "experimental-optimization"
    paths:
      - ".github/workflows/rust-contracts.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "lib/main.dart"
      - "rust-toolchain.toml"
      - "test/background_oracle_test.dart"
      - "test/closed_graph_oracle_test.dart"
      - "test/full_screen_oracle_test.dart"
      - "test/goldens/**"
  pull_request:
    paths:
      - ".github/workflows/rust-contracts.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "lib/main.dart"
      - "rust-toolchain.toml"
      - "test/background_oracle_test.dart"
      - "test/closed_graph_oracle_test.dart"
      - "test/full_screen_oracle_test.dart"
      - "test/goldens/**"

permissions:
  contents: read

concurrency:
  group: rust-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Domain, decoding, and renderer contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore compiler artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.95-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install declared minimum Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Install declared native link dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dri libxkbcommon-x11-0 xvfb

      - name: Reject formatting drift
        run: cargo +1.95.0 fmt --all -- --check

      - name: Reject warnings and unsound surface growth
        run: cargo +1.95.0 clippy --workspace --all-targets -- -D warnings

      - name: Falsify move and compatibility contracts
        run: cargo +1.95.0 test --workspace --all-targets

      - name: Create and present a real hidden Linux window
        run: |
          xvfb-run --auto-servernum cargo +1.95.0 run -p not-news-platform --example hidden_smoke
          NOT_NEWS_FORCE_SOFTWARE=1 xvfb-run --auto-servernum cargo +1.95.0 run -p not-news-platform --example hidden_smoke

  windows-compile:
    name: Windows surface and application compile
    runs-on: windows-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore compiler artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.95-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install declared minimum Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Compile every Windows target without running it
        run: cargo +1.95.0 check --workspace --all-targets

      - name: Create and present a real hidden Windows window
        run: cargo +1.95.0 run -p not-news-platform --example hidden_smoke
